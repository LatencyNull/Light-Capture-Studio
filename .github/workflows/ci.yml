name: CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Run Tests (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore LightCaptureStudio.sln

    - name: Build Solution (Release)
      run: dotnet build LightCaptureStudio.sln -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test LightCaptureStudio.sln -c Release --no-build --verbosity normal
